# Tests HoloPi on every push and pull request, in three jobs:
#
# - python: the tests, in Debian 13 with Debian's packages, as the image has
#   them. Mesa's llvmpipe draws on the processor, so the GPU's interleaving is
#   tested off screen too, on a runner without a GPU. Then the check that the
#   diagrams' images are up to date with their sources.
# - web: the web page, in ./web, type checked, tested and built with the pnpm
#   version its package.json pins.
# - image: docker/Dockerfile built, as ./docker/dock.sh build builds it, here
#   for amd64: Debian's FFmpeg, not Raspberry Pi's, which only arm64 gets.

name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install the packages
        run: >
          apt-get update -qq && apt-get install -qq -y --no-install-recommends
          python3 python3-numpy python3-pil python3-fastapi python3-uvicorn python3-python-multipart
          python3-httpx python3-av libegl1 libgles2 libgbm1 libgl1-mesa-dri libegl-mesa0
      - uses: actions/checkout@v4
      - name: Test
        run: python3 -m unittest discover tests
      - name: Check the diagrams
        run: bin/check-diagrams.sh

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f docker/Dockerfile -t holo-pi .
