[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stepit-holo"
dynamic = ["version"]
description = "Show quilts on a Looking Glass Portrait as holograms."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giovanni Remigi" }]
requires-python = ">=3.11"
# GTK's Python bindings, for the window, come from the system: python3-gi and gir1.2-gtk-3.0.
dependencies = ["numpy", "pillow"]

[project.scripts]
stepit-holo = "stepit_holo.cli:main"

[tool.setuptools]
packages = ["stepit_holo"]

[tool.setuptools.dynamic]
version = { attr = "stepit_holo.__version__" }
