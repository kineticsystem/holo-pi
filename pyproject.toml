[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "holo-pi"
dynamic = ["version"]
description = "Show quilts on a Looking Glass Portrait as holograms."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giovanni Remigi" }]
requires-python = ">=3.11"
# GTK's Python bindings, for the window, come from the system: python3-gi and gir1.2-gtk-3.0.
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
# holo-pi serve: pipx install "holo-pi[server] @ git+https://..."
server = ["fastapi", "uvicorn", "python-multipart"]

[project.scripts]
holo-pi = "holo_pi.cli:main"

[tool.setuptools]
packages = ["holo_pi"]

[tool.setuptools.dynamic]
version = { attr = "holo_pi.__version__" }
