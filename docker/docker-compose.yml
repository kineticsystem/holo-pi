# HoloPi's server, in one container, holo-pi: it shows on the Looking
# Glass the quilts that other computers upload, on port 8095. Driven by
# ./dock.sh.
#
# It shows through DRM/KMS, straight to the screen, so it needs a computer
# where no desktop drives the screens, e.g. a Raspberry Pi with Raspberry Pi
# OS Lite. It runs as root, which DRM/KMS and mounting the Looking Glass's
# drive need.

name: holo-pi

services:
  holo-pi:
    build: .
    image: holo-pi:latest
    container_name: holo-pi
    hostname: holo-pi
    init: true
    # The server starts with the computer, once it has been started with
    # dock.sh: Docker starts it again at boot, until dock.sh stop stops it.
    restart: unless-stopped
    # The devices: the screens, through /dev/dri, and the Looking Glass's
    # drive, through /dev/disk/by-label, which the server mounts read-only, in
    # the container only. Mounting the whole of /dev, rather than each device,
    # lets the Looking Glass be unplugged and plugged in again while the server
    # runs. Privileged also allows the mount.
    privileged: true
    # The server listens on the host's port, 8095.
    network_mode: host
    volumes:
      - ..:/holo-pi:ro
      - /dev:/dev
      # The host's mounted drives, where a desktop mounts the Looking Glass's,
      # e.g. /media/<user>/LKG-P00671, as /run/media/<user>/LKG-P00671, where
      # the server looks too. rslave: a drive mounted later shows there too.
      - /media:/run/media:ro,rslave
      # The last quilt, shown again after a restart, and the tables.
      - state:/var/lib/holo-pi
    command:
      - python3
      - -m
      - holo_pi
      - serve
      - --screen
      - drm
      - --state
      - /var/lib/holo-pi
      # Nothing else mounts the Looking Glass's drive in the container.
      - --mount-drive
      # Shown when no quilt is kept, e.g. at the first start: numbers, the test
      # quilt, or a quilt of the mounted repo, e.g. quilts/wasp_qs8x6a0.75.jpg.
      - --default-quilt
      - "${HOLO_PI_DEFAULT_QUILT:-numbers}"
      - --port
      - "${HOLO_PI_PORT:-8095}"

volumes:
  state:
